<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No Means No</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">☾</span> <span>No Means No</span></div>
  <nav class="nav">
    <button class="nav-btn" data-screen="today"><span>📋</span>اليوم</button>
    <button class="nav-btn" data-screen="world"><span>🗺</span>العالم</button>
    <button class="nav-btn" data-screen="shop"><span>🛒</span>المتجر</button>
  </nav>
  <div class="top-right">
    <div class="gold-box keys-box" id="keys-box" role="button" title="المفاتيح: بالمفتاح تفتح منطقة جديدة أو ترفع رتبة شخصية">🗝 <b id="keys">0</b></div>
    <div id="gold-box" class="gold-box" title="الذهب: بتكسبه من مهامك وبتطوّر وتزيّن فيه أماكنك">🪙 <b id="gold">0</b></div>
    <button id="settings" class="account gear" aria-label="الإعدادات" title="الإعدادات">⚙️</button>
    <button id="account" class="account">👤</button>
  </div>
</header>

<div id="loading" class="loading">جارٍ التحميل…</div>
<main id="app" hidden><div id="screen"></div>
  <footer class="foot"><span id="mode"></span> · <span id="sync" class="sync"></span></footer>
</main>

<div id="modal" class="modal" hidden><div class="modal-box"><button id="modal-close" class="modal-close" aria-label="إغلاق">✕</button><div id="modal-body"></div></div></div>
<div id="fx" class="fx"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
