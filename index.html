<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No Means No</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">☾</span> <span>No Means No</span></div>
  <nav class="nav">
    <button class="nav-btn" data-screen="world"><span>🗺</span>العالم</button>
    <button class="nav-btn" data-screen="shop"><span>🧭</span>الأبعاد</button>
    <button class="nav-btn week-btn" id="nav-week" title="وضع التجربة: كأنه مرّ أسبوع" hidden><span>📬</span>مرّ أسبوع</button>
  </nav>
  <div class="top-right">
    <button class="gold-box offer-box" id="offer-box" title="رسالة الأحد" hidden>📬 <b>رسالة الأحد</b></button>
    <div class="gold-box keys-box" id="habits-box" role="button" title="العادات اللي بنيتها بكل الأبعاد">المباني <b id="habits">0</b></div>
    <button id="settings" class="account gear" aria-label="الإعدادات" title="الإعدادات">الإعدادات</button>
    <button id="account" class="account">حسابك</button>
  </div>
</header>

<div id="loading" class="loading">جارٍ التحميل…</div>
<main id="app" hidden><div id="screen"></div>
  <footer class="foot"><span id="mode"></span> · <span id="sync" class="sync"></span></footer>
</main>

<div id="modal" class="modal" hidden><div class="modal-box"><button id="modal-close" class="modal-close" aria-label="إغلاق">✕</button><div id="modal-body"></div></div></div>
<div id="fx" class="fx"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
